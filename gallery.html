<!DOCTYPE html>
<!-- Artzee Website - Developed by the Painted Owl aka Clint Lutz -->
<html lang="en">

<head>
  <title>Art Gallery</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<style>
#wrapper > main.container {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-rows: max-content;
  gap: 20px;
  align-items: center;
  justify-items: center;
}

.frame {
  width: 75%;
  min-width: 0;
  margin: 0;
  box-sizing: border-box;
  aspect-ratio: 3 / 4;
  border: 1px solid #333;
  padding: 5px;
  overflow: hidden;
}

.frame.horzt {
  width: 100%;
  aspect-ratio: 4 / 3;
}

.frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

</style>


<body>
  <div id="wrapper">
    <header>
      <h1>Artzee</h1>
    </header>

	<nav>
		<ul>
			<li><a href="index.html">Home</a></li>
			<li><a href="gallery.html">Gallery</a></li>
			<li><a href="directory.html">Directory</a></li>
			<li><a href="aboutus.html">About Us</a></li>
		</ul>
	</nav>

    <main class="container">
		<div class="frame horzt"><img src="img/1864 Hauling a boat ashore - Claude Monet.jpg" alt="Monet"></div>
		<div class="frame"><img src="img/1881 Song of the Angels - William Bouguereau.jpg" alt="Bouguereau"></div>
		<div class="frame horzt"><img src="img/1888 Starry Night Over the Rhône - Vincent Van Gogh.jpg" alt="Van Gogh"></div>
		<div class="frame"><img src="img/1891 Circe Offering the Cup to Ulysses - John Waterhouse.jpg" alt="Waterhouse"></div>
		<div class="frame"><img src="img/1925 Pierot Playing the Guitar - Salvador Dali.jpg" alt="Dali"></div>
		<div class="frame"><img src="img/1932 Girl before a Mirror - Pablo Picasso.jpg" alt="Picasso"></div>
    </main>

    <footer>
      <span class="site-name">Artzee</span>
      <span class="copyright">&copy; 2026 All rights reserved.</span>
    </footer>
  </div>
</body>

</html>
